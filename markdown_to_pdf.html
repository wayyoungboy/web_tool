<html lang="zh-CN">
<head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {

            opacity: 0.9;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;

            color: white;

        }

        .content {
            padding: 40px;
        }

        .tool-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;

            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tool-section:hover {
            border-color: #667eea;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .tool-title {
            font-size: 1.4em;
            color: #333;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .tool-description {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .input-mode-tabs {
            display: flex;

            margin-bottom: 20px;
        }

        .tab-btn {

            border: 2px solid #ddd;

        }

        .tab-btn.active {

        .upload-area:hover {

        .upload-area.dragover {

        .upload-icon {

        .upload-text {
            color: #666;

        .upload-hint {

        #fileInput {

        .editor-area {

        .editor-area textarea {

        .editor-area textarea:focus {

        }

        .file-info-bar {
            display: none;
            background: #e8f5e9;

            color: #2e7d32;

        .button-group {

        .action-btn:hover {

        .secondary-btn {

        }

        .secondary-btn:hover {
            background: #5a6268;

        .preview-container {
            display: none;
            background: white;
            border-radius: 10px;

        #previewContent {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            font-size: 14px;
            line-height: 1.8;

        #previewContent h1 { font-size: 2em; margin: 0.67em 0; color: #222; border-bottom: 2px solid #eee; padding-bottom: 0.3em; }
        #previewContent h2 { font-size: 1.5em; margin: 0.75em 0; color: #333; border-bottom: 1px solid #eee; padding-bottom: 0.3em; }
        #previewContent h3 { font-size: 1.17em; margin: 0.83em 0; color: #444; }

        #previewContent p { margin: 1em 0; }
        #previewContent a { color: #667eea; text-decoration: none; }
        #previewContent a:hover { text-decoration: underline; }
        #previewContent table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
        }
        #previewContent th, #previewContent td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }
        #previewContent th {
            background: #f5f5f5;
            font-weight: 600;
        }
        #previewContent tr:nth-child(even) {

        }
        #previewContent ul, #previewContent ol {
            margin: 1em 0;

        }
        #previewContent li { margin-bottom: 0.3em; }
        #previewContent img {

        #previewContent blockquote {

            color: #666;

            background: #f8f9ff;

        }
        #previewContent pre {
            background: #f6f8fa;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 1em 0;
            border: 1px solid #e1e4e8;
        }
        #previewContent code {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9em;
        }
        #previewContent :not(pre) > code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
        }
        #previewContent hr {
            border: none;
            border-top: 2px solid #eee;
            margin: 1.5em 0;
        }
        #previewContent input[type="checkbox"] {
            margin-right: 6px;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-section {
            display: none;
            margin-top: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }

        .result-section {
            display: none;
            text-align: center;
            padding: 30px;
            background: #e8f5e9;
            border-radius: 15px;
            margin-top: 20px;
        }

        .result-icon {
            font-size: 4em;
            color: #4caf50;
            margin-bottom: 15px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9em;
            border-top: 1px solid #eee;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .content { padding: 20px; }
            .header h1 { font-size: 1.8em; }
            .preview-container { padding: 20px; }
            .input-mode-tabs { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">

            <h1>Markdown转PDF</h1>

        <div class="content">

                <h3 class="tool-title">输入Markdown内容</h3>
                <p class="tool-description">上传 .md 文件或直接输入Markdown文本，纯前端处理，文件不会上传到服务器</p>

                <div class="upload-area" id="uploadArea">

                    <div class="upload-hint">支持 .md / .markdown 格式，文件大小限制 10MB</div>
                    <input type="file" id="fileInput" accept=".md,.markdown,.txt">
                </div>

                <div class="editor-area" id="editorArea">
                    <textarea id="mdEditor" placeholder="在此输入或粘贴Markdown内容...

                </div>

                <div class="file-info-bar" id="fileInfoBar"></div>
            </div>

            <div class="tool-section" id="previewSection" style="display: none;">
                <h3 class="tool-title">文档预览</h3>
                <p class="tool-description">以下是Markdown渲染后的预览效果，确认无误后可转换为PDF</p>

                <div class="button-group">
                    <button class="action-btn" id="convertBtn">转换为PDF</button>
                    <button class="secondary-btn action-btn" id="resetBtn">重新输入</button>
                </div>

                <div class="preview-container" id="previewContainer">
                    <div id="previewContent"></div>
                </div>
            </div>

            <div class="tool-section progress-section" id="progressSection">
                <h3 class="tool-title">转换进度</h3>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">准备转换...</div>
            </div>

            <div class="tool-section result-section" id="resultSection">
                <div class="result-icon">&#10003;</div>
                <h3 class="tool-title">转换完成</h3>
                <p class="tool-description">PDF文件已生成，请下载</p>

                    <button class="action-btn" id="downloadBtn">下载PDF文件</button>

        <div class="footer">

    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText">处理中...</div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const editorArea = document.getElementById('editorArea');
        const mdEditor = document.getElementById('mdEditor');
        const fileInfoBar = document.getElementById('fileInfoBar');
        const previewSection = document.getElementById('previewSection');
        const previewContainer = document.getElementById('previewContainer');
        const previewContent = document.getElementById('previewContent');
        const convertBtn = document.getElementById('convertBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progressSection = document.getElementById('progressSection');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const resultSection = document.getElementById('resultSection');
        const downloadBtn = document.getElementById('downloadBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const tabUpload = document.getElementById('tabUpload');
        const tabEditor = document.getElementById('tabEditor');

        let markdownText = '';
        let originalFileName = 'markdown';
        let currentMode = 'upload';

        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true
        });

        tabUpload.addEventListener('click', () => {
            currentMode = 'upload';
            tabUpload.classList.add('active');
            tabEditor.classList.remove('active');
            uploadArea.style.display = 'block';
            editorArea.style.display = 'none';
        });

        tabEditor.addEventListener('click', () => {
            currentMode = 'editor';
            tabEditor.classList.add('active');
            tabUpload.classList.remove('active');
            uploadArea.style.display = 'none';
            editorArea.style.display = 'block';
        });

        let editorTimer = null;
        mdEditor.addEventListener('input', () => {
            clearTimeout(editorTimer);
            editorTimer = setTimeout(() => {
                const text = mdEditor.value.trim();
                if (text) {
                    markdownText = text;
                    originalFileName = 'markdown';
                    renderPreview();
                } else {
                    previewSection.style.display = 'none';
                }
            }, 500);
        });

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        convertBtn.addEventListener('click', () => convertToPdf());

        resetBtn.addEventListener('click', () => {
            fileInput.value = '';
            mdEditor.value = '';
            markdownText = '';
            originalFileName = 'markdown';
            previewSection.style.display = 'none';
            previewContainer.style.display = 'none';
            previewContent.innerHTML = '';
            fileInfoBar.style.display = 'none';
            progressSection.style.display = 'none';
            resultSection.style.display = 'none';
            if (currentMode === 'upload') {
                uploadArea.style.display = 'block';
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (!markdownText) return;
            generatePdf();
        });

        function handleFile(file) {
            const name = file.name.toLowerCase();
            if (!name.endsWith('.md') && !name.endsWith('.markdown') && !name.endsWith('.txt')) {
                alert('请上传 .md / .markdown / .txt 格式的文件');
                return;
            }
            if (file.size > 10 * 1024 * 1024) {
                alert('文件大小超过10MB限制');
                return;
            }

            showLoading('正在读取文件...');
            originalFileName = file.name.replace(/\.(md|markdown|txt)$/i, '');

            const reader = new FileReader();
            reader.onload = function(e) {
                markdownText = e.target.result;
                fileInfoBar.textContent = '已加载: ' + file.name;
                fileInfoBar.style.display = 'block';
                renderPreview();
                hideLoading();
            };
            reader.onerror = () => {
                hideLoading();
                alert('文件读取失败');
            };
            reader.readAsText(file, 'UTF-8');
        }

        function renderPreview() {
            const html = marked.parse(markdownText);
            previewContent.innerHTML = html;

            previewContent.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });

            previewContainer.style.display = 'block';
            previewSection.style.display = 'block';
        }

        function showLoading(text) {
            loadingText.textContent = text;
            loadingOverlay.style.display = 'flex';
        }

        function hideLoading() {
            loadingOverlay.style.display = 'none';
        }

        function updateProgress(percent, text) {
            progressFill.style.width = percent + '%';
            progressText.textContent = text;
        }

        async function convertToPdf() {
            if (!markdownText) {
                alert('请先输入或上传Markdown内容');
                return;
            }

            progressSection.style.display = 'block';
            resultSection.style.display = 'none';
            updateProgress(10, '准备转换...');

            await new Promise(r => setTimeout(r, 100));

            try {
                updateProgress(30, '渲染文档...');
                await new Promise(r => setTimeout(r, 100));

                updateProgress(60, '生成PDF...');
                await generatePdf();

                updateProgress(100, '转换完成！');
                await new Promise(r => setTimeout(r, 500));

                progressSection.style.display = 'none';
                resultSection.style.display = 'block';
            } catch (error) {
                console.error(error);
                alert('PDF生成失败: ' + error.message);
                progressSection.style.display = 'none';
            }
        }

        async function generatePdf() {
            const { jsPDF } = window.jspdf;

            const el = document.getElementById('previewContent');

            await new Promise(r => setTimeout(r, 200));

            const canvas = await html2canvas(el, {
                scale: 2,
                useCORS: true,
                logging: false,
                backgroundColor: '#ffffff',
            });

            const imgData = canvas.toDataURL('image/jpeg', 0.95);
            const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

            const pdfWidth = 210;
            const pdfHeight = 297;
            const margin = 10;
            const usableWidth = pdfWidth - margin * 2;

            const imgW = canvas.width;
            const imgH = canvas.height;
            const imgRatio = imgW / imgH;
            const renderedHeightMm = usableWidth / imgRatio;
            const usableHeight = pdfHeight - margin * 2;

            let yOffsetMm = 0;
            let page = 0;

            while (yOffsetMm < renderedHeightMm) {
                if (page > 0) pdf.addPage();

                const remaining = renderedHeightMm - yOffsetMm;
                const pageContent = Math.min(usableHeight, remaining);

                const startF = yOffsetMm / renderedHeightMm;
                const pageF = pageContent / renderedHeightMm;

                const srcY = startF * imgH;
                const srcH = pageF * imgH;

                const sc = document.createElement('canvas');
                sc.width = imgW;
                sc.height = Math.ceil(srcH);
                sc.getContext('2d').drawImage(canvas, 0, srcY, imgW, srcH, 0, 0, imgW, sc.height);

                const sImg = sc.toDataURL('image/jpeg', 0.95);
                const sRatio = sc.width / sc.height;

                pdf.addImage(sImg, 'JPEG', margin, margin, usableWidth, usableWidth / sRatio);

                yOffsetMm += pageContent;
                page++;
            }

            pdf.save(originalFileName + '.pdf');
        }
    </script>
